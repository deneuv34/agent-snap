name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

jobs:
  go:
    name: Go core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
      - name: gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1
      - name: build binary
        shell: bash
        run: go build -o "bin/agent-snap$(go env GOEXE)" ./cmd/agent-snap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-snap-${{ matrix.os }}
          path: bin/agent-snap*

  bun:
    name: TypeScript adapters on Bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: typecheck
        run: bun run typecheck
      - name: unit tests
        run: bun run test

  node:
    name: Pi runtime on Node (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: core and pi unit tests on Node
        run: bun run test:node

  smoke:
    name: Smoke test (${{ matrix.os }})
    needs: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: agent-snap-ubuntu-latest
            bin: agent-snap
          - os: windows-latest
            artifact: agent-snap-windows-latest
            bin: agent-snap.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.artifact }}
          path: bin
      - name: make binary executable
        if: runner.os != 'Windows'
        run: chmod +x bin/${{ matrix.bin }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: smoke (includes a compiled Bun host)
        env:
          AGENT_SNAP_BIN: ${{ github.workspace }}/bin/${{ matrix.bin }}
        run: bun run smoke
      - name: integration tests against real binary on Bun
        env:
          AGENT_SNAP_BIN: ${{ github.workspace }}/bin/${{ matrix.bin }}
        run: bun test --timeout 30000 ./packages/core/test/integration.test.ts ./packages/pi/test/integration.test.ts
      - name: integration tests against real binary on Node
        env:
          AGENT_SNAP_BIN: ${{ github.workspace }}/bin/${{ matrix.bin }}
        run: node --import tsx --test packages/core/test/integration.test.ts packages/pi/test/integration.test.ts

  package:
    name: Packed-package install check
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-snap-ubuntu-latest
          path: bin
      - run: chmod +x bin/agent-snap
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: pack-check (bun pm pack, npm install of the tarballs, consumer check on Node and Bun)
        env:
          AGENT_SNAP_BIN: ${{ github.workspace }}/bin/agent-snap
        run: bun run pack-check
